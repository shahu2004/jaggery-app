name: Java CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Create application databases
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS jaggery_auth; CREATE DATABASE IF NOT EXISTS jaggery_product;"

      - name: Test Auth Service
        working-directory: backend/auth-service/auth-service
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/jaggery_auth?useSSL=false&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: root
          JWT_SECRET: jaggery-local-ci-secret-change-me-2026-987654321
          EUREKA_URL: http://127.0.0.1:8761/eureka
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode test

      - name: Test Product Service
        working-directory: backend/product-service/product-service
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/jaggery_product?useSSL=false&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: root
          JWT_SECRET: jaggery-local-ci-secret-change-me-2026-987654321
          EUREKA_URL: http://127.0.0.1:8761/eureka
          UPLOAD_DIR: ${{ runner.temp }}/jaggery-uploads
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode test

      - name: Test Discovery Server
        working-directory: backend/discovery-server/discovery-server
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode test
